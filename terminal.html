<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a2d8a">
<title>ВТБ · Терминал</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blue:#0a2d8a;--blue2:#0d47c4;--blueL:#e6edfc;--bg:#f5f7fa;--card:#fff;--bd:#e6eaf0;--tx:#1a1f2b;--mu:#8a95a5;--rd:#e5443b;--gn:#21a038;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-font-smoothing:antialiased;user-select:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;padding-top:calc(14px + var(--st));background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}
.brand .mark{width:44px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.brand .mark::before{content:"≡";margin-right:3px;font-size:16px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.conn .dot{width:9px;height:9px;border-radius:50%;background:#ccc}
.conn.on .dot{background:var(--gn);box-shadow:0 0 0 4px rgba(33,160,56,.2);animation:pulse 2s infinite}
.conn.off .dot{background:var(--rd);box-shadow:0 0 0 4px rgba(229,68,59,.2)}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1;overflow-y:auto;padding:24px 20px calc(24px + var(--sb));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.code-screen{max-width:420px;width:100%}
.code-screen .brand-lg{width:110px;height:86px;border-radius:20px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;margin:0 auto 26px;box-shadow:0 20px 50px rgba(10,45,138,.3)}
.code-screen .brand-lg::before{content:"≡";margin-right:6px;font-size:40px}
.code-screen h1{font-size:26px;font-weight:800;margin-bottom:8px}
.code-screen .sub{font-size:14px;color:var(--mu);margin-bottom:30px;line-height:1.5}
.code-input{width:100%;font-size:36px;font-weight:900;letter-spacing:12px;text-align:center;padding:22px;border-radius:18px;border:2px solid var(--bd);background:#fff;font-family:"Courier New",monospace;outline:none;margin-bottom:14px;color:var(--blue);text-transform:uppercase}
.code-input:focus{border-color:var(--blue)}
.btn-big{display:block;width:100%;padding:20px;border:none;border-radius:16px;font-size:18px;font-weight:800;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.btn-big:active{transform:scale(.98);background:#082467}
.wait-screen{max-width:500px;width:100%}
.wait-icon{width:160px;height:160px;border-radius:50%;background:var(--blueL);display:flex;align-items:center;justify-content:center;font-size:80px;margin:0 auto 30px;animation:bigPulse 2s ease-in-out infinite}
@keyframes bigPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,71,196,.4)}50%{box-shadow:0 0 0 40px rgba(13,71,196,0)}}
.wait-screen h1{font-size:28px;font-weight:800;margin-bottom:12px}
.wait-screen .sub{font-size:16px;color:var(--mu);line-height:1.6}
.pin-screen{max-width:480px;width:100%}
.pin-title{font-size:22px;font-weight:800;margin-bottom:8px}
.pin-sub{font-size:14px;color:var(--mu);margin-bottom:20px}
.pin-dots{display:flex;gap:20px;justify-content:center;margin:30px 0}
.pin-dots .dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--blue);transition:.2s}
.pin-dots .dot.f{background:var(--blue);transform:scale(1.1)}
.keypad{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:360px;margin:20px auto 0}
.key{width:calc(33.333% - 8px);max-width:100px;aspect-ratio:1;border:2px solid var(--bd);background:#fff;border-radius:18px;font-size:28px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--tx);transition:.12s;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--blueL);border-color:var(--blue);transform:scale(.95)}
.key.fn{font-size:16px;color:var(--mu);font-weight:600}
.card-screen{max-width:500px;width:100%}
.card-icon{width:180px;height:180px;border-radius:50%;background:var(--blueL);display:flex;align-items:center;justify-content:center;font-size:90px;margin:0 auto 30px;animation:bigPulse 1.6s ease-in-out infinite}
.amount-big{font-size:48px;font-weight:900;color:var(--blue);margin:20px 0;letter-spacing:-1px}
.success-icon{width:120px;height:120px;border-radius:50%;background:var(--gn);color:#fff;font-size:60px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:pop .4s cubic-bezier(.5,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.success-screen h1{font-size:26px;font-weight:800;margin-bottom:10px}
.success-screen .sub{font-size:15px;color:var(--mu);margin-bottom:30px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1f2b;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:100;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--rd)}
.exit-btn{position:fixed;top:calc(14px + var(--st));right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.1);border:none;color:#666;font-size:16px;cursor:pointer;z-index:99;display:none;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="mark">ВТБ</div></div>
  <div class="conn off" id="connBadge"><span class="dot"></span><span id="connText">Не подключён</span></div>
</div>

<button class="exit-btn" id="exitBtn" onclick="disconnect()">✕</button>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCbUVpD7AIxh2ZBkAmZGOj7EXNWLpIL_8",
  authDomain: "vtb-operator.firebaseapp.com",
  databaseURL: "https://vtb-operator-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "vtb-operator",
  storageBucket: "vtb-operator.firebasestorage.app",
  messagingSenderId: "297366565046",
  appId: "1:297366565046:web:c33f3fd1e88c2fc3e3b617"
};

var sessionCode = null;
var db = null;
var currentPin = "";
var pinStep = 0;
var pinTemp = "";
var currentRequest = null;

function $(id) { return document.getElementById(id); }
function toast(text, cls) {
  var t = $("toast");
  t.textContent = text;
  t.className = "toast show " + (cls || "");
  clearTimeout(window.__tt);
  window.__tt = setTimeout(function() { t.className = "toast " + (cls || ""); }, 2200);
}
function setConn(online, text) {
  var b = $("connBadge");
  b.className = "conn " + (online ? "on" : "off");
  $("connText").textContent = text;
}
function setContent(html) { $("content").innerHTML = html; }

function initFirebase() {
  if (typeof firebase === "undefined") { setTimeout(initFirebase, 500); return; }
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    showCodeScreen();
  } catch (e) {
    toast("Firebase: " + e.message, "err");
  }
}

function showCodeScreen() {
  setConn(false, "Не подключён");
  setContent(
    '<div class="code-screen">' +
      '<div class="brand-lg">ВТБ</div>' +
      '<h1>Введите код сессии</h1>' +
      '<p class="sub">Код показан на экране операциониста</p>' +
      '<input class="code-input" id="codeInput" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off">' +
      '<button class="btn-big" onclick="connect()">Подключиться</button>' +
    '</div>'
  );
}

function connect() {
  var inp = $("codeInput");
  if (!inp) return;
  var code = inp.value.replace(/\s/g, "").toUpperCase();
  if (code.length < 4) { toast("Введите код", "err"); return; }
  sessionCode = code;
  setConn(true, "Подключение...");

  var sessionRef = db.ref("sessions/" + sessionCode);
  var reqRef = sessionRef.child("request");

  sessionRef.child("terminalOnline").set(true);
  sessionRef.child("terminalOnline").onDisconnect().set(false);

  reqRef.on("value", function(snap) {
    var r = snap.val();
    if (!r) return;
    handleRequest(r);
  });

  $("exitBtn").style.display = "flex";
  setConn(true, "Связь с ПК");
  screenWait();
}

function disconnect() {
  if (sessionCode && db) db.ref("sessions/" + sessionCode + "/terminalOnline").set(false);
  sessionCode = null;
  showCodeScreen();
  setConn(false, "Не подключён");
}

function sendResponse(type, data) {
  if (!db || !sessionCode) return;
  var payload = { type: type, ts: Date.now() };
  if (data) for (var k in data) payload[k] = data[k];
  db.ref("sessions/" + sessionCode + "/response").set(payload);
}

function handleRequest(r) {
  currentRequest = r;
  if (r.type === "payment") screenPayment(r.sum);
  else if (r.type === "issue-card") { pinStep = 1; currentPin = ""; pinTemp = ""; screenPin("Придумайте ПИН", "Шаг 1 из 2"); }
  else if (r.type === "change-pin") { pinStep = 1; currentPin = ""; pinTemp = ""; screenPin("Старый ПИН", "Шаг 1 — старый"); }
  else if (r.type === "transfer") screenConfirm("Перевод", r.sum + " ₽ на " + r.to);
  else if (r.type === "withdraw") screenConfirm("Выдача наличных", r.sum + " ₽");
  else if (r.type === "deposit") screenConfirm("Пополнение", r.sum + " ₽");
  else if (r.type === "service") screenConfirm("Операция", r.sum + " ₽");
}

function screenWait() {
  setContent(
    '<div class="wait-screen">' +
      '<div class="wait-icon">🏦</div>' +
      '<h1>Ожидание операции</h1>' +
      '<p class="sub">Операционист готовит запрос.<br>Подождите...</p>' +
    '</div>'
  );
}

function screenPin(title, sub) {
  currentPin = "";
  var keys = "";
  for (var i = 1; i <= 9; i++) keys += '<button class="key" onclick="pinPress(' + i + ')">' + i + '</button>';
  keys += '<button class="key fn" onclick="pinClear()">C</button>';
  keys += '<button class="key" onclick="pinPress(0)">0</button>';
  keys += '<button class="key fn" onclick="pinBack()">⌫</button>';
  setContent(
    '<div class="pin-screen">' +
      '<div class="pin-title">' + title + '</div>' +
      '<p class="pin-sub">' + sub + '</p>' +
      '<div class="pin-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>' +
      '<div class="keypad">' + keys + '</div>' +
    '</div>'
  );
}

function pinPress(n) {
  if (currentPin.length >= 4) return;
  currentPin += "" + n;
  updatePinDots();
  if (currentPin.length === 4) setTimeout(pinComplete, 250);
}
function pinBack() { currentPin = currentPin.slice(0, -1); updatePinDots(); }
function pinClear() { currentPin = ""; updatePinDots(); }
function updatePinDots() {
  var dots = document.querySelectorAll(".pin-dots .dot");
  for (var i = 0; i < dots.length; i++) {
    if (i < currentPin.length) dots[i].className = "dot f";
    else dots[i].className = "dot";
  }
}

function pinComplete() {
  if (pinStep === 1) {
    if (currentRequest.type === "issue-card") { pinTemp = currentPin; currentPin = ""; pinStep = 2; screenPin("Повторите ПИН", "Шаг 2 из 2"); }
    else if (currentRequest.type === "change-pin") { pinTemp = currentPin; currentPin = ""; pinStep = 2; screenPin("Новый ПИН", "Шаг 2 — новый"); }
    return;
  }
  if (pinStep === 2) {
    if (currentRequest.type === "issue-card") {
      if (currentPin !== pinTemp) { toast("ПИН не совпали", "err"); sendResponse("pin-error"); pinStep = 1; currentPin = ""; pinTemp = ""; screenPin("Придумайте ПИН", "Попробуйте снова"); return; }
      sendResponse("pin-set"); screenSuccess("ПИН установлен", "Передайте операционисту"); return;
    }
    if (currentRequest.type === "change-pin") { pinTemp = currentPin; currentPin = ""; pinStep = 3; screenPin("Повторите ПИН", "Шаг 3 — повторите"); return; }
  }
  if (pinStep === 3) {
    if (currentPin !== pinTemp) { toast("ПИН не совпали", "err"); sendResponse("pin-error"); pinStep = 2; currentPin = ""; screenPin("Новый ПИН", "Попробуйте снова"); return; }
    sendResponse("pin-set"); screenSuccess("ПИН изменён", "Передайте операционисту");
  }
}

function screenPayment(sum) {
  setContent(
    '<div class="card-screen">' +
      '<div class="card-icon">📲</div>' +
      '<h1 style="font-size:22px;font-weight:800;margin-bottom:10px">Приложите карту</h1>' +
      '<p style="font-size:15px;color:var(--mu);margin-bottom:6px">К оплате</p>' +
      '<div class="amount-big">' + Number(sum).toLocaleString("ru-RU") + ' ₽</div>' +
      '<p style="font-size:14px;color:var(--mu);margin-bottom:30px">Или телефон с NFC</p>' +
      '<button class="btn-big" onclick="cardAttached()">📲 Карта приложена</button>' +
    '</div>'
  );
}
function cardAttached() { sendResponse("card-attached"); screenSuccess("Оплата прошла", "Спасибо! Средства списаны."); }

function screenConfirm(title, sub) {
  setContent(
    '<div class="wait-screen">' +
      '<div class="wait-icon">✓</div>' +
      '<h1>' + title + '</h1>' +
      '<p class="sub">' + sub + '</p>' +
      '<button class="btn-big" style="margin-top:30px" onclick="confirmOperation()">✓ Подтвердить</button>' +
    '</div>'
  );
}
function confirmOperation() { sendResponse("operation-confirmed"); screenSuccess("Подтверждено", "Операция выполнена"); }

function screenSuccess(title, sub) {
  setContent(
    '<div class="success-screen">' +
      '<div class="success-icon">✓</div>' +
      '<h1>' + title + '</h1>' +
      '<p class="sub">' + sub + '</p>' +
      '<button class="btn-big" onclick="screenWait()">Готово</button>' +
    '</div>'
  );
}

setTimeout(initFirebase, 300);
</script>
</body>
</html>
